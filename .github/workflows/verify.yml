name: Verify Tunnel development
on:
  push:
    branches: [main]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Browser WebRTC P2P smoke (real Chrome, no Supabase quota)
        run: node scripts/webrtc_browser_smoke.mjs
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: '/Chat'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_IMGBB_API_KEY: ${{ secrets.NEXT_PUBLIC_IMGBB_API_KEY }}
          NEXT_PUBLIC_IMGBB_UPLOAD_URL: 'https://api.imgbb.com/1/upload'
      - name: Verify CHAT production hostname and admin route
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 30 \
            --output /tmp/chat-admin.html 'https://chat.monsterport.com/admin/moderation/'
          test -s /tmp/chat-admin.html
          grep -q '<html' /tmp/chat-admin.html
